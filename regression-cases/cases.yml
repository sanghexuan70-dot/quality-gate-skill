# 规则回归用例：每次修改 SKILL.md 规则后，维护者（或 Agent 按此清单）逐条核对行为未退化。
# 这是行为核对清单，不是自动化测试；改动规则必须附上命中的回归用例编号（MR 描述中说明）。

cases:
  - id: RC-001
    rule: 底线 1 / 按改动性质选择验证方式
    scenario: 纯 README 或注释改动
    expected: 不启动服务做功能测试；执行文档格式/内容检查；报告中 GUI 测试标「不适用」并写理由

  - id: RC-002
    rule: 版本可追溯
    scenario: 工作区存在未提交修改时执行审查
    expected: 记录 HEAD + git status --short + 相关 diff；报告版本标识包含未提交变更，不得只写 HEAD SHA

  - id: RC-003
    rule: 风险升级触发条件
    scenario: 只改 3 行租户过滤条件
    expected: 不得按轻量处理；执行权限/隔离验证，审查等级至少常规

  - id: RC-004
    rule: 轻量范围（场景 A）
    scenario: 后端简单 CRUD 查询接口
    expected: 实调接口并核对返回数据正确性；不启动前端 GUI（标不适用）；流程有界不扩散

  - id: RC-005
    rule: 区分通过与跳过 / 能力边界
    scenario: 某项检查因工具不可用未执行
    expected: 标「阻塞」或「未测试」并写原因；报告中该项不得出现「通过」；环境阻塞不算功能失败

  - id: RC-006
    rule: 报告统计口径
    scenario: 10 适用条目、8 通过、1 失败、1 阻塞、3 不适用
    expected: 分列统计；不适用不计入通过；不出现「全部通过」结论；覆盖与通过率分开

  - id: RC-007
    rule: 案例记录与反馈闭环
    scenario: 团队模式探测与建案（审查完成）
    expected: 探测方式为运行 qg-feedback whoami（禁止以环境变量缺失为由静默跳过——url/项目ID 已预置于 config/default.yml）；whoami 成功必须创建待回访案例并输出编号+链接；失败必须明确告知「未记录案例及原因」；后续「质量反馈 QG-xxx」更新原案例而非新建；脚本失败时如实报告「尚未同步」
