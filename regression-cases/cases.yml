# 规则回归用例：每次修改 SKILL.md 规则后，维护者（或 Agent 按此清单）逐条核对行为未退化。
# 这是行为核对清单，不是自动化测试；改动规则必须附上命中的回归用例编号（MR 描述中说明）。

cases:
  - id: RC-001
    rule: 底线 1 / 按改动性质选择验证方式
    scenario: 纯 README 或注释改动
    expected: 不启动服务做功能测试；执行文档格式/内容检查；报告中 GUI 测试标「不适用」并写理由

  - id: RC-002
    rule: 版本可追溯
    scenario: 工作区存在未提交修改时执行审查
    expected: 记录 HEAD + git status --short + 相关 diff；报告版本标识包含未提交变更，不得只写 HEAD SHA

  - id: RC-003
    rule: 风险升级触发条件
    scenario: 只改 3 行租户过滤条件
    expected: 不得按轻量处理；执行权限/隔离验证，审查等级至少常规

  - id: RC-004
    rule: 轻量范围（场景 A）
    scenario: 后端简单 CRUD 查询接口
    expected: 实调接口并核对返回数据正确性；不启动前端 GUI（标不适用）；流程有界不扩散

  - id: RC-005
    rule: 区分通过与跳过 / 能力边界
    scenario: 某项检查因工具不可用未执行
    expected: 标「阻塞」或「未测试」并写原因；报告中该项不得出现「通过」；环境阻塞不算功能失败

  - id: RC-006
    rule: 报告统计口径
    scenario: 10 适用条目、8 通过、1 失败、1 阻塞、3 不适用
    expected: 分列统计；不适用不计入通过；不出现「全部通过」结论；覆盖与通过率分开

  - id: RC-007
    rule: 案例记录与反馈闭环
    scenario: 团队模式探测与建案（审查完成）
    expected: 探测方式为运行 qg-feedback whoami（禁止以环境变量缺失为由静默跳过——url/项目ID 已预置于 config/default.yml）；whoami 成功必须创建待回访案例并输出编号+链接，案例标题含任务摘要（task_summary，≤40 字）；失败必须明确告知「未记录案例及原因」；后续「质量反馈 QG-xxx」更新原案例而非新建；脚本失败时如实报告「尚未同步」

  - id: RC-008
    rule: 案例字段完整性（v1.2.0 起）
    scenario: 创建任一案例
    expected: 含 task_type 与 task_summary（bugfix 类附原始症状与预期行为）；code_review 区分 detected_findings 与 open_findings（处置未确认记 null，不得臆断为 0），P1 及以上有 items 明细（级别/位置/处置）；code_version 含分支与改动文件清单；回访前 retrospective 为空、案例 Issue 内无改进提案内容

  - id: RC-010
    rule: 回访收口自判定（v1.3.2 起）
    scenario: 用户发起任一形式回访
    expected: Agent 同轮判定是否关闭——通过→关闭；缺陷已修复→defect --fixed 同轮关闭；缺陷未处置→保持打开并告知「缺陷已修复」关闭话术；反馈无法判断处置状态才追问，不得要求用户二次指挥关闭

  - id: RC-011
    rule: 建案字段名一致性
    scenario: 建案 JSON 中出现已知别名（如 duration_seconds）或未知字段
    expected: 脚本自动映射别名到 schema 字段并对未知顶层字段告警；真实耗时不得因字段名漂移丢失（009 教训）

  - id: RC-012
    rule: 成本指标自计时必填（v1.3.4 起）
    scenario: 建案时 execution_metrics.elapsed_seconds 缺失或为 null
    expected: 脚本拒绝创建并明确提示自计时义务（依据：提案 #3——8 案例审计 7 例 None，字段被误归为平台数据）；正常建案的 elapsed 为实测值

  - id: RC-013
    rule: 误报闭环（v1.4.0 起，提案 #4）
    scenario: 回访确认某审查发现实际不是问题
    expected: false-positive 命中 items 明细则 confirmed=false、多命中时拒绝并列出候选要求更长关键词；计入 follow_up.confirmed_false_positives 并留评论；案例状态标签不变更；success 时案例有审查发现则输出误报补记提示

  - id: RC-009
    rule: 执行成本控制与停止条件（v1.3.0 起）
    scenario: 审查接近或超出等级软预算
    expected: 超预算先砍可选检查与无关回归；必测项未完成仍如实标未测试/阻塞，不得报通过；execution_metrics 中耗时/Token 等取不到的字段记 null，禁止估算；满足停止条件即收口，无风险依据不扩展检查；同类操作重试不超过上限（默认 3 次）；不得擅自提交/丢弃/覆盖用户未提交修改
